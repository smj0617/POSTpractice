spring:
  application:
    name: POSTpractice
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL # 프로젝트 폴더에 db_dev.mv.db 파일로 저장
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true  # 실행되는 SQL을 콘솔에 출력
    hibernate:
      ddl-auto: update  # 엔티티를 보고 테이블을 자동 생성/수정
    properties:
      hibernate:
        format_sql: true  # SQL을 보기 좋게 줄바꿈
